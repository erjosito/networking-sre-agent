# SRE Agent Configuration Manifest
# This file declares the desired state for the Azure SRE Agent.
# Run scripts/configure-sre-agent.ps1 to reconcile this manifest against the live agent.

agent:
  name: netsre-sre-agent
  resourceGroup: netsre-rg
  # Action mode for the live agent's actionConfiguration.mode.
  # Autonomous = investigate AND remediate without waiting for user approval
  # (Review would pause every incident/fix for manual approval → stuck flows).
  mode: Autonomous

# Knowledge base files to upload (relative to repo root)
knowledge:
  - knowledge/azure-networking-fundamentals.md
  - knowledge/hub-spoke-topology.md
  - knowledge/vpn-expressroute-connectivity.md
  - knowledge/expressroute-deep-dive.md
  - knowledge/network-security-nva.md
  - knowledge/load-balancing-services.md
  - knowledge/dns-and-private-link.md
  - knowledge/private-link-and-dns.md
  - knowledge/monitoring-troubleshooting.md
  - knowledge/common-failure-scenarios.md
  - knowledge/azure-firewall-and-ddos.md
  - knowledge/azure-front-door.md
  - knowledge/virtual-wan.md
  # On-premises networking (containerlab fabric + telemetry + fault runbooks)
  - knowledge/onprem-network-topology.md
  - knowledge/onprem-telemetry-and-observability.md
  - knowledge/onprem-bgp-fault-runbook.md
  - knowledge/onprem-ospf-fault-runbook.md
  # On-prem fabric triage procedure (also authored as a portal skill; uploaded here
  # so the targeted procedure is retrievable even without the portal skill attached)
  - sre-agent-config/skills/onprem-fabric-triage/SKILL.md

# Custom agents (sub-agents)
customAgents:
  - name: network-expert
    definitionFile: sre-agent-config/custom-agents/network-expert.yaml
  - name: connectivity-triage
    definitionFile: sre-agent-config/custom-agents/connectivity-triage.yaml

# Skills
skills:
  - name: nva-troubleshooting
    directory: sre-agent-config/skills/nva-troubleshooting
  - name: vpn-bgp-diagnostics
    directory: sre-agent-config/skills/vpn-bgp-diagnostics
  - name: private-endpoint-dns
    directory: sre-agent-config/skills/private-endpoint-dns
  - name: onprem-fabric-triage
    directory: sre-agent-config/skills/onprem-fabric-triage

# Incident response plans
responsePlans:
  - name: connectivity-failure
    description: Route Connection Monitor failure alerts to the network expert
    severity: [Sev1, Sev2]
    titleContains: ""
    customAgent: network-expert
    autonomy: Autonomous
    cooldownHours: 3
    processingGuide:
      - "Determine the failing layer FIRST: is this an Azure hub-spoke path or an on-premises fabric alert (title/resource contains 'onprem' or 'clab')?"
      - "For on-premises/containerlab alerts, follow the on-prem-fabric-triage skill: pull the EXACT triggering signal (the syslog rows or the Connection Monitor test result) BEFORE assessing device health, then inspect OSPF/BGP control-plane state on the implicated device AND its neighbor."
      - "For Azure hub-spoke alerts, follow the standard methodology: failing path -> DNS -> effective routes -> NVA health -> NSG -> VPN/BGP -> peering -> AppGW -> Private Endpoint."
      - "Never conclude a device is healthy solely because it still emits telemetry (SNMP/Heartbeat/syslog) — a control-plane fault can break reachability while liveness signals stay green."
  - name: onprem-fabric-clab
    description: Route containerlab fabric Connection Monitor failures (r1<->r2 OSPF/BGP/link faults; OSPF cascades to BGP) to the network expert with the on-prem triage procedure
    severity: [Sev1, Sev2]
    titleContains: "clab"
    customAgent: network-expert
    autonomy: Autonomous
    cooldownHours: 3
    processingGuide: &onpremGuide
      - "Use the on-prem-fabric-triage skill. STEP 1 (never skip): pull the EXACT triggering signal for the alert window. For a Connection Monitor alert, query NWConnectionMonitorTestResult for TestGroupName 'clabhost-to-infabric-server' (passed/failed by 1m). For a syslog alert, query Syslog | where Facility=='daemon' and SeverityLevel in ('error','critical','alert','emergency') | project TimeGenerated, HostName, ProcessName, SeverityLevel, SyslogMessage. Quote the actual message/failure."
      - "STEP 2: from the alert's HostName/ProcessName dimensions and the syslog message, identify the device (onprem-r1 / onprem-r2) and subsystem (ospfd / bgpd / zebra/kernel), and classify the fault: adjacency/session down, stuck adjacency, or route missing while the session/adjacency is UP (a policy fault)."
      - "STEP 3: inspect the CONTROL PLANE on the implicated device AND its neighbor over the transit — do not rely on reachability alone. Run via az vm run-command on VM netsre-onprem-clab using base64-encoded bash. OSPF FIRST (it underpins BGP): docker exec clab-onprem-onprem-r1 vtysh -c 'show ip ospf neighbor' and 'show ip ospf interface eth1' on BOTH r1 and r2, plus 'show ip route 10.99.2.2' (peer loopback via OSPF?). BGP: 'show ip bgp summary' and 'show ip route 172.31.20.0/24' on r1, and 'show ip bgp neighbor 10.99.1.1 advertised-routes' on r2."
      - "Blast radius (CASCADE): BGP peers loopback-to-loopback over the OSPF-learned loopbacks, so an OSPF adjacency fault (area/MTU/network-type) withdraws the peer loopback, drops the BGP session, withdraws the LAN 172.31.20.0/24, and FAILS the clab Connection Monitor. So a clab CM alert can be rooted in OSPF, BGP, or the transit link. Find the ROOT LAYER by checking OSPF adjacency FIRST: OSPF empty + 'O 10.99.2.2/32' gone => OSPF root cause (the BGP-down is a symptom); OSPF Full => a genuine BGP fault (if Established but LAN absent, the route is filtered/withdrawn — check r2 advertised-routes and any outbound route-map)."
      - "STEP 4 (recent changes): compare live 'show running-config' on r1 and r2 to the committed source of truth infra/containerlab/configs/{r1,r2}/frr.conf; review OnPremAAA_CL logins in the last 6h; widen the Syslog window and drop the severity filter to catch notice/info OSPF/BGP flaps leading up to the alert; check SNMP sysUpTime (onprem/snmp) for a reboot."
      - "STEP 5: confirm the collector is alive (Heartbeat for Computer=='onprem-collector'); if missing, telemetry is stale, not healthy."
      - "STEP 6 (remediate + verify): apply the fix for the identified fault (see scripts/inject-fault.ps1 clab-* scenarios for the exact vtysh inject/revert), then verify recovery: OSPF neighbor Full, BGP Established with PfxRcd 1, LAN route present on r1, and the Connection Monitor passing. Durable fixes belong in frr.conf."
  - name: onprem-fabric-syslog
    description: Route on-prem device syslog/telemetry alerts (incl. OSPF adjacency faults) to the network expert with the on-prem triage procedure
    severity: [Sev1, Sev2, Sev3]
    titleContains: "onprem"
    customAgent: network-expert
    autonomy: Autonomous
    cooldownHours: 3
    processingGuide: *onpremGuide
  - name: latency-degradation
    description: Route high-latency alerts for investigation
    severity: [Sev4]
    titleContains: "latency"
    customAgent: network-expert
    autonomy: Autonomous
    cooldownHours: 6

# Scheduled tasks
scheduledTasks:
  - name: daily-nva-health
    description: Daily NVA health verification
    schedule: "0 8 * * *"  # 8 AM UTC daily
    maxExecutions: 365
    autonomy: Autonomous
    instructions: |
      Run a comprehensive health check on all NVA VMs in the netsre-rg resource group.
      For each NVA (netsre-hub1-nva, netsre-hub2-nva):
      1. Verify the VM is running (az vm get-instance-view)
      2. Check IP forwarding is enabled on the NIC (az network nic show)
      3. Run 'sysctl net.ipv4.ip_forward' on the VM to verify OS-level forwarding
      4. Run 'sudo iptables -t nat -L INTERNET_SNAT -n' to verify SNAT rules
      5. Run 'systemctl is-active dnsmasq' to verify DNS proxy is running
      6. Check the NVA load balancer health probe status
      If any check fails, report the specific failure and suggest remediation steps
      from the knowledge base.

  - name: weekly-bgp-route-check
    description: Weekly BGP route propagation verification
    schedule: "0 6 * * 1"  # 6 AM UTC every Monday
    maxExecutions: 52
    autonomy: Autonomous
    instructions: |
      Verify BGP route propagation across all VPN gateways in netsre-rg.
      1. Check VPN connection status for all 4 connections (hub1-to-onprem, hub2-to-onprem, onprem-to-hub1, onprem-to-hub2)
      2. Get BGP peer status for each gateway (az network vnet-gateway list-bgp-peer-status)
      3. Get learned routes for each gateway (az network vnet-gateway list-learned-routes)
      4. Verify that spoke prefixes (10.11.0.0/16, 10.12.0.0/16, 10.21.0.0/16, 10.22.0.0/16) are learned by the onprem gateway
      5. Verify that the onprem prefix (10.100.0.0/16) is learned by both hub gateways
      6. Check that route tables have correct UDRs with BGP propagation disabled on spoke RTs
      Report any missing routes or BGP peering issues with suggested fixes.

  - name: weekly-connection-monitor-review
    description: Weekly review of Connection Monitor test results
    schedule: "0 9 * * 5"  # 9 AM UTC every Friday
    maxExecutions: 52
    autonomy: Autonomous
    instructions: |
      Review Connection Monitor test results for the past 7 days in netsre-rg.
      1. Query the netsre-connection-monitor for all test groups
      2. Identify any tests with >5% failure rate over the week
      3. For failing tests, correlate with Azure Monitor metrics and NVA logs
      4. Check if any spoke-to-staticweb (private endpoint) tests show degradation
      5. Compare latency trends for spoke-to-onprem tests (VPN path)
      6. Generate a summary report of connectivity health trends
      Flag any recurring failures that might indicate a systemic issue.
