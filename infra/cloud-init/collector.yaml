#cloud-config
# On-prem telemetry collector: rsyslog server (receives device syslog on 514),
# Azure Monitor Agent picks up the Syslog stream via its DCR, and Telegraf polls
# SNMP and publishes to Azure Monitor custom metrics via managed identity.
package_update: true
packages:
  - rsyslog
  - snmp
  - snmpd
  - telegraf
  - curl
  - gnupg
  # FreeRADIUS acts as the on-prem AAA server: network devices (the FRR router)
  # authenticate operator logins against it, and it writes an audit trail that
  # AMA ships to Log Analytics (OnPremAAA_CL) — see infra/modules/onprem-aaa.bicep.
  - freeradius

write_files:
  # Receive remote syslog over UDP and TCP on 514. AMA (via its Syslog DCR)
  # reads messages that flow through rsyslog and forwards them to Log Analytics.
  - path: /etc/rsyslog.d/10-remote.conf
    owner: root:root
    permissions: '0644'
    content: |
      module(load="imudp")
      input(type="imudp" port="514")
      module(load="imtcp")
      input(type="imtcp" port="514")
      # Keep a local copy of received device logs for troubleshooting.
      template(name="RemoteHost" type="string" string="/var/log/remote/%HOSTNAME%.log")
      if ($fromhost-ip != "127.0.0.1") then {
        action(type="omfile" dynaFile="RemoteHost")
      }

  # Minimal SNMP agent bound to localhost so Telegraf has a target to prove the
  # SNMP -> Azure Monitor path end-to-end (real device targets are added later).
  - path: /etc/snmp/snmpd.conf
    owner: root:root
    permissions: '0600'
    content: |
      agentAddress udp:127.0.0.1:161
      rocommunity public 127.0.0.1
      sysLocation onprem-collector
      sysContact netops

  # Telegraf: SNMP input -> Azure Monitor custom metrics output.
  # Written as a drop-in under /etc/telegraf/telegraf.d/ (which the packaged
  # unit loads via '-config-directory') so the package's own /etc/telegraf/
  # telegraf.conf conffile stays pristine — otherwise the apt install hits a
  # conffile prompt, half-configures, and never creates the '_telegraf' user.
  # region and resource_id are auto-detected from IMDS; auth uses the VM's
  # managed identity (needs the Monitoring Metrics Publisher role). SNMP is
  # polled from the in-path FRR router (fixed static IP 10.100.1.201).
  - path: /etc/telegraf/telegraf.d/onprem.conf
    owner: root:root
    permissions: '0644'
    content: |
      [agent]
        interval = "60s"
        flush_interval = "60s"
        omit_hostname = false

      [[outputs.azure_monitor]]
        namespace_prefix = "onprem/"

      [[inputs.snmp]]
        agents = ["udp://10.100.1.201:161"]
        version = 2
        community = "public"
        timeout = "5s"
        retries = 1
        [[inputs.snmp.field]]
          name = "sysName"
          oid = "1.3.6.1.2.1.1.5.0"
          is_tag = true
        [[inputs.snmp.field]]
          name = "sysUpTime"
          oid = "1.3.6.1.2.1.1.3.0"
        [[inputs.snmp.table]]
          name = "interface"
          oid = "1.3.6.1.2.1.2.2"
          [[inputs.snmp.table.field]]
            name = "ifDescr"
            oid = "1.3.6.1.2.1.2.2.1.2"
            is_tag = true
          [[inputs.snmp.table.field]]
            name = "ifInOctets"
            oid = "1.3.6.1.2.1.2.2.1.10"
          [[inputs.snmp.table.field]]
            name = "ifOutOctets"
            oid = "1.3.6.1.2.1.2.2.1.16"

  # ── FreeRADIUS (AAA server) ────────────────────────────────────────────────
  # These files are staged to non-conffile paths and copied into place in
  # runcmd AFTER the apt install. cloud-init write_files runs BEFORE apt, so
  # writing a package conffile (clients.conf, the users file) directly collides
  # with the package version and the install half-configures — the same trap
  # that bit snmpd/telegraf. Stage-then-copy avoids it.

  # RADIUS clients: localhost (for local radtest) + the FRR router as a NAS.
  # RADIUS_SECRET_PLACEHOLDER is substituted by onprem-collector.bicep.
  - path: /etc/freeradius/3.0/clients.onprem.conf
    owner: root:root
    permissions: '0640'
    content: |
      client localhost {
          ipaddr = 127.0.0.1
          secret = testing123
      }
      client onprem-frr {
          ipaddr = 10.100.1.201
          secret = RADIUS_SECRET_PLACEHOLDER
          nastype = other
          require_message_authenticator = no
      }

  # Operator account the devices authenticate. RADIUS_OPERPASS_PLACEHOLDER is
  # substituted by onprem-collector.bicep. Appended to the FreeRADIUS users file.
  - path: /etc/freeradius/3.0/authorize.onprem
    owner: root:root
    permissions: '0640'
    content: |
      netops-oper Cleartext-Password := "RADIUS_OPERPASS_PLACEHOLDER"

runcmd:
  - mkdir -p /var/log/remote
  - mkdir -p /etc/telegraf/telegraf.d
  - systemctl enable --now rsyslog
  - systemctl enable --now snmpd
  # Telegraf is installed from the Ubuntu archive (see packages:) and reads its
  # drop-in from /etc/telegraf/telegraf.d/. Restart to pick up onprem.conf.
  - systemctl enable telegraf
  - systemctl restart telegraf
  # FreeRADIUS: install our client list + operator over the package conffiles
  # (staged above), then enable auth logging WITHOUT recording passwords. The
  # audit trail lands in /var/log/freeradius/radius.log, which the AAA DCR tails.
  - install -m 0640 -o root -g freerad /etc/freeradius/3.0/clients.onprem.conf /etc/freeradius/3.0/clients.conf
  - cat /etc/freeradius/3.0/authorize.onprem >> /etc/freeradius/3.0/mods-config/files/authorize
  - sed -i 's/^\(\s*\)auth = no/\1auth = yes/' /etc/freeradius/3.0/radiusd.conf
  - sed -i 's/^\(\s*\)auth_badpass = .*/\1auth_badpass = no/' /etc/freeradius/3.0/radiusd.conf
  - sed -i 's/^\(\s*\)auth_goodpass = .*/\1auth_goodpass = no/' /etc/freeradius/3.0/radiusd.conf
  - systemctl enable freeradius
  - systemctl restart freeradius
