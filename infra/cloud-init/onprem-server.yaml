#cloud-config
# On-prem server: the Connection Monitor target that lives BEHIND the FRR router,
# so breaking the router breaks data-plane reachability to it. Serves HTTP for
# probes and forwards its logs to the telemetry collector.
package_update: true
packages:
  - apache2
  - curl
  - traceroute
  - net-tools
  - inetutils-ping
  - dnsutils
  - tcpdump
  - snmpd

write_files:
  - path: /var/www/html/index.html
    permissions: '0644'
    content: |
      <!DOCTYPE html>
      <html>
      <head><title>On-Prem Server</title></head>
      <body>
        <h1>Hello from the simulated on-prem server</h1>
        <p><strong>Hostname:</strong> HOSTNAME_PLACEHOLDER</p>
        <p><strong>Purpose:</strong> Data-plane probe target behind the FRR router</p>
      </body>
      </html>

  # Forward every log to the telemetry collector over UDP/514.
  - path: /etc/rsyslog.d/90-forward.conf
    owner: root:root
    permissions: '0644'
    content: |
      *.* @COLLECTOR_IP_PLACEHOLDER:514

  - path: /etc/snmp/snmpd.conf
    owner: root:root
    permissions: '0600'
    content: |
      agentAddress udp:161
      rocommunity public 10.0.0.0/8
      sysLocation onprem-server
      sysContact netops

runcmd:
  - sed -i "s/HOSTNAME_PLACEHOLDER/$(hostname)/" /var/www/html/index.html
  - systemctl enable --now apache2
  - systemctl enable --now snmpd
  - systemctl restart rsyslog
