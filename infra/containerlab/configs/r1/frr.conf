frr version 9.1
frr defaults traditional
hostname onprem-r1
service integrated-vtysh-config
log syslog informational
!
interface lo
 ip address 10.99.1.1/32
!
interface eth1
 description transit-to-onprem-r2
 ip address 172.31.12.1/30
 ip ospf network point-to-point
!
interface eth2
 description host-facing-probe-link
 ip address 172.31.11.2/30
!
router bgp 65101
 bgp router-id 10.99.1.1
 no bgp ebgp-requires-policy
 neighbor 172.31.12.2 remote-as 65102
 neighbor 172.31.12.2 description onprem-r2-core
 !
 address-family ipv4 unicast
  network 172.31.11.0/30
 exit-address-family
!
! OSPF is the on-prem IGP: it carries the router loopbacks over the r1<->r2
! transit link (area 0). The loopbacks are advertised ONLY via OSPF (not BGP),
! so an OSPF adjacency fault (e.g. an area/network mismatch on eth1) withdraws
! the peer loopback while the BGP-carried data path (172.31.20.0/24) stays up —
! a realistic "IGP misconfig breaks internal/management reachability" scenario.
router ospf
 ospf router-id 10.99.1.1
 network 172.31.12.0/30 area 0
 network 10.99.1.1/32 area 0
!
line vty
!
