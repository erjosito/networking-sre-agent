frr version 9.1
frr defaults traditional
hostname onprem-r1
service integrated-vtysh-config
log syslog informational
!
interface lo
 ip address 10.99.1.1/32
!
interface eth1
 description transit-to-onprem-r2
 ip address 172.31.12.1/30
 ip ospf network point-to-point
 ip ospf hello-interval 2
 ip ospf dead-interval 8
!
interface eth2
 description host-facing-probe-link
 ip address 172.31.11.2/30
!
! BGP peers loopback-to-loopback (multihop) and is therefore RELIANT on the OSPF
! underlay: r1 can only reach the peer loopback 10.99.2.2 via the OSPF-learned
! route over the transit. If the OSPF adjacency breaks, 10.99.2.2 becomes
! unreachable, the BGP session drops, and the LAN route 172.31.20.0/24 is
! withdrawn — so an IGP fault cascades all the way to the data path (and the
! Connection Monitor). Fast timers make the cascade converge in ~15s for demos.
router bgp 65101
 bgp router-id 10.99.1.1
 no bgp ebgp-requires-policy
 neighbor 10.99.2.2 remote-as 65102
 neighbor 10.99.2.2 description onprem-r2-core
 neighbor 10.99.2.2 update-source lo
 neighbor 10.99.2.2 ebgp-multihop 2
 neighbor 10.99.2.2 timers 3 9
 !
 address-family ipv4 unicast
  network 172.31.11.0/30
 exit-address-family
!
! OSPF is the on-prem IGP underlay. It carries the router loopbacks over the
! r1<->r2 transit link (area 0). The loopbacks are advertised ONLY via OSPF (not
! BGP), and BGP peers over those loopbacks — so an OSPF adjacency fault (e.g. an
! area/network mismatch on eth1) withdraws the peer loopback, which tears down
! the BGP session and the entire data path. This is the classic real-WAN
! "IGP underlay + BGP over loopbacks" design.
router ospf
 ospf router-id 10.99.1.1
 network 172.31.12.0/30 area 0
 network 10.99.1.1/32 area 0
!
line vty
!
