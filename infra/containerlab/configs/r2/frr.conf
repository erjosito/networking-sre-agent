frr version 9.1
frr defaults traditional
hostname onprem-r2
service integrated-vtysh-config
log syslog informational
!
interface lo
 ip address 10.99.2.2/32
!
interface eth1
 description transit-to-onprem-r1
 ip address 172.31.12.2/30
 ip ospf network point-to-point
 ip ospf hello-interval 2
 ip ospf dead-interval 8
!
interface eth2
 description onprem-lan
 ip address 172.31.20.1/24
!
! BGP peers loopback-to-loopback (multihop) over the OSPF underlay — see r1.
! r2 reaches the peer loopback 10.99.1.1 only via OSPF, so an OSPF fault tears
! down this session and withdraws the LAN 172.31.20.0/24 from r1.
router bgp 65102
 bgp router-id 10.99.2.2
 no bgp ebgp-requires-policy
 neighbor 10.99.1.1 remote-as 65101
 neighbor 10.99.1.1 description onprem-r1-edge
 neighbor 10.99.1.1 update-source lo
 neighbor 10.99.1.1 ebgp-multihop 2
 neighbor 10.99.1.1 timers 3 9
 !
 address-family ipv4 unicast
  network 172.31.20.0/24
 exit-address-family
!
! OSPF is the on-prem IGP underlay. It carries the router loopbacks over the
! r1<->r2 transit link (area 0). The loopbacks are advertised ONLY via OSPF (not
! BGP), and BGP peers over those loopbacks — so an OSPF adjacency fault withdraws
! the peer loopback, tears down the BGP session, and breaks the LAN data path.
router ospf
 ospf router-id 10.99.2.2
 network 172.31.12.0/30 area 0
 network 10.99.2.2/32 area 0
!
line vty
!
